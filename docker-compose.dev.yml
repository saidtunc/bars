
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
      - ./reports:/app/reports
    env_file:
      - .env
    environment:
      - WATCHFILES_FORCE_POLLING=true
      - HOST_STORAGE_PATH=${PWD}/storage
      - HOST_HOME_DIR=${HOME}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - WATCH_USE_POLLING=true
      - VITE_AUTH_REQUIRED=true
    depends_on:
      - backend
    command: npm run dev -- --host
